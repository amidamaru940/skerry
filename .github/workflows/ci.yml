name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Tests and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        # The app needs Swift 6.1 or later.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Privacy configuration
        # First and on its own: nothing networked is on by default.
        run: python3 -m unittest tests.test_privacy_configuration

      - name: Configuration tests
        # Network allowlist, localization, fork identity and the rest.
        run: python3 -m unittest discover tests

      - name: Build (ad-hoc signed)
        # The notch app cannot be driven on a headless runner, so CI builds it;
        # the unit tests run locally (see CONTRIBUTING.md).
        run: |
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual
