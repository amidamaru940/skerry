name: Bug report
description: Something in Skerry does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please leave out anything personal: crop screenshots to the island, and do not paste clipboard contents you would not share.
  - type: input
    id: version
    attributes:
      label: Skerry version
      description: Settings → General → About, or the DMG you installed.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro 14-inch (M3)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Take three screenshots with ⇧⌘4
        2. Open the island → Clipboard → Screenshots
        3. …
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal information from text and screenshots.
          required: true
